name: Monthly panel data refresh

on:
  schedule:
    # Runs at 03:00 UTC (11:00 AM Malaysia time) on the 2nd of every month.
    # The 2nd (not the 1st) gives Great Eastern a day's buffer in case they
    # publish the new month's PDFs a little late.
    - cron: "0 3 2 * *"
  # Lets you trigger it manually from the Actions tab too, for testing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poppler (for pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Run the data refresh script
        run: python3 scripts/update_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "panel-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to the data this month — nothing to commit."
          else
            git commit -m "Monthly panel data refresh ($(date -u +%Y-%m-%d))"
            # If someone pushed other commits to the repo while this run was
            # in progress, rebase on top of them before pushing, instead of
            # failing outright.
            git pull --rebase origin main
            git push
          fi
